# Curated expression bank (PRD §55, §17.5) — set expressions and
# grammar patterns distinct from ordinary vocabulary.Kind entries: the
# learner is expected to already understand these receptively, and the
# vocabulary activator's job is to notice when one has gone a long time
# without ever being *produced*. reading is left "" when expression is
# already pure kana (nothing to disambiguate); otherwise it's the full
# hiragana reading. kind is either "expression" (a standalone idiomatic
# phrase) or "pattern" (a bound grammar construction that attaches to a
# verb/adjective stem, marked here with a leading 〜).
#
# Loaded by `jlp seed` via internal/domain/vocabulary.LoadBank and
# storage.VocabularyRepository.SeedBankItem (see cmd/jlp/seed.go) —
# insert-if-absent, so re-running never resets a learner's real
# lookup/production counts on an expression that's since been used.
#
# The first four entries are PRD §55's own worked examples.

- expression: "〜というわけではない"
  reading: ""
  meaning: "It's not that...; that doesn't necessarily mean..."
  kind: pattern

