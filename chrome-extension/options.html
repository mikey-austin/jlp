<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>JLP 設定</title>
<script>
  // See popup.html for why this conditional load is safe to leave in a
  // packed extension: it never fires (and shim/chrome-shim.js is never
  // requested) once a real window.chrome.storage exists.
  if (!(window.chrome && window.chrome.storage)) {
    document.write('<script src="shim/chrome-shim.js"><\/script>');
  }
</script>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header class="popup-header"><span class="brand">JLP 設定</span></header>
<main>
  <form id="options-form" class="jlp-form">
    <label>Base URL
      <input type="url" id="base-url" required placeholder="http://localhost:8080">
    </label>
    <label>APIトークン
      <input type="password" id="api-token" placeholder="jlp_…" autocomplete="off">
    </label>
    <p class="hint">
      JLPの<a id="tokens-link" href="#" target="_blank" rel="noopener">設定 → APIトークン</a>で発行してください。
      必要な権限: <code>vocabulary:write</code>、<code>sessions:write</code>、<code>feedback:request</code>、<code>reading:write</code>（Kindle版）。
    </p>
    <label>デフォルトセッション ID（任意）
      <input type="text" id="session-id" placeholder="未設定なら最新のセッションを使用">
    </label>
    <label>チャットURL（任意）
      <input type="url" id="chat-url" placeholder="https://a2a.lan.jackiemclean.net">
    </label>
    <p class="hint">未設定の場合、右クリックメニューに「JLPでチャット」は表示されません。</p>
    <label class="inline"><span><input type="checkbox" id="auto-deliver"> Kindle版ができたら自動でKindleに送信</span></label>
    <p class="hint">JLP側でKindle送信が設定されている場合のみ有効です。</p>
    <button type="submit">保存</button>
  </form>
  <p id="options-status" class="hint"></p>
</main>
<script src="options.js"></script>
</body>
</html>
