services:
  app:
    build: { context: ., target: dev }
    ports: ["${APP_HOST_PORT:-8080}:8080"]
    # Lets the app reach a model server running on the HOST rather than
    # in this compose network — set
    # APP_AI_OLLAMA_URL=http://host.docker.internal:11434 to use an
    # Ollama the operator already runs natively (typically the one with
    # GPU access), instead of joining the "ollama" profile below. Docker
    # Desktop provides this name automatically; on plain Linux it does
    # not, hence the explicit host-gateway mapping.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/src
      - gomod:/go/pkg/mod
      - gocache:/root/.cache/go-build
    environment:
      # The bind-mounted repo is owned by the host user while the container
      # runs as root, so git inside the container refuses to read .git
      # (safe.directory) and `go build` would hard-fail on VCS stamping.
      GOFLAGS: -buildvcs=false
      APP_DATABASE_URL: postgres://jlp:jlp@postgres:5432/jlp?sslmode=disable
      APP_AUTH_MODE: ${APP_AUTH_MODE:-static}
      # Caddy's fixed address on the pinned subnet below (NOT the bridge
      # gateway 172.28.5.1, which is what direct host->published-port
      # traffic hairpins through — see internal/adapters/authelia). Trusting
      # the gateway too would let anyone on the host bypass Caddy entirely.
      APP_AUTH_TRUSTEDPROXIES: 127.0.0.1/32,172.28.5.9/32
      APP_AI_PROVIDER: ${APP_AI_PROVIDER:-fake}
      APP_AI_ANTHROPIC_APIKEY: ${ANTHROPIC_API_KEY:-}
      # Empty is safe here: viper's getEnv only honors a bound env var when
      # it's non-empty (see internal/config.TestEmptyEnvVarDoesNotClobberDefault),
      # so an unset APP_AI_ANTHROPIC_MODEL/BASEURL in .env falls through to
      # config's own defaults (claude-sonnet-5 / https://api.anthropic.com)
      # rather than blanking them out.
      APP_AI_ANTHROPIC_MODEL: ${APP_AI_ANTHROPIC_MODEL:-}
      APP_AI_ANTHROPIC_BASEURL: ${APP_AI_ANTHROPIC_BASEURL:-}
      APP_AI_OLLAMA_URL: ${APP_AI_OLLAMA_URL:-http://ollama:11434}
      APP_AI_OLLAMA_MODEL: ${APP_AI_OLLAMA_MODEL:-}
      # Bounds one /api/chat round trip. Generous, because a local model
      # loading cold weights can take a minute before its first token —
      # but never unbounded (see internal/config.Ollama.Timeout).
      APP_AI_OLLAMA_TIMEOUT: ${APP_AI_OLLAMA_TIMEOUT:-}
      APP_AI_ROUTES: ${APP_AI_ROUTES:-}
      # Phase 4 Task 2's opt-in agentic teacher (PRD §27/§50): unset (the
      # default) keeps Phase 1's single-shot structured-generation path —
      # see internal/config.AI.AgenticTeacher's doc comment.
      APP_AI_AGENTICTEACHER: ${APP_AI_AGENTICTEACHER:-}
      # Empty (the default) keeps the Anki review queue's AnkiConnect push
      # dormant — see internal/config.Anki's doc comment. TSV export needs
      # no configuration at all.
      APP_ANKI_CONNECT_URL: ${APP_ANKI_CONNECT_URL:-}
      # Weekly email summary (Phase 3 Task 5, PRD §21/§65): Enabled false
      # (the default) keeps the cron scheduler entirely unconstructed —
      # see internal/config.Summary's doc comment. SMTP_ADDR's default
      # (mailpit:1025) is the "mail" profile's in-network address below;
      # it's only ever dialed once Enabled=true.
      APP_SUMMARY_ENABLED: ${APP_SUMMARY_ENABLED:-false}
      APP_SUMMARY_CRON: ${APP_SUMMARY_CRON:-}
      APP_SUMMARY_TO: ${APP_SUMMARY_TO:-}
      APP_SUMMARY_FROM: ${APP_SUMMARY_FROM:-}
      APP_SMTP_ADDR: ${APP_SMTP_ADDR:-}
      # Empty (the default) keeps the MQTT event bridge entirely
      # dormant — see internal/config.MQTT's doc comment. `make up-mqtt`
      # (the "mqtt" profile) sets this to the in-network mosquitto
      # service's address.
      APP_MQTT_URL: ${APP_MQTT_URL:-}
      # A2A protocol adapter (Phase 4 Task 3, PRD §29/§30): unset (the
      # default) keeps its routes entirely absent — see
      # internal/config.A2A's doc comment.
      APP_A2A_ENABLED: ${APP_A2A_ENABLED:-false}
      APP_A2A_PATH: ${APP_A2A_PATH:-}
      # Slack channel adapter (Phase 4 Task 4, PRD §20/§20.1): both
      # tokens empty (the default) keeps it entirely dormant — see
      # internal/config.Slack's doc comment. No new service needed here:
      # Socket Mode dials OUT to Slack, so there's no inbound port for
      # compose to publish or route.
      APP_SLACK_APPTOKEN: ${APP_SLACK_APPTOKEN:-}
      APP_SLACK_BOTTOKEN: ${APP_SLACK_BOTTOKEN:-}
      APP_SLACK_SMOKECHANNEL: ${APP_SLACK_SMOKECHANNEL:-}
      # Signal channel adapter (Phase 4 Task 5, PRD §20/§20.1): both
      # empty (the default) keeps it entirely dormant — see
      # internal/config.Signal's doc comment. RPCURL points at the
      # "signal-cli" service below (the "signal" profile — not started
      # by `make up`; join it with `make up-signal`), which is
      # in-network only, no host port published.
      APP_SIGNAL_RPCURL: ${APP_SIGNAL_RPCURL:-}
      APP_SIGNAL_NUMBER: ${APP_SIGNAL_NUMBER:-}
      APP_CHANNELS_ALLOWFROM: ${APP_CHANNELS_ALLOWFROM:-}
    depends_on:
      postgres: { condition: service_healthy }

  postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_USER: jlp, POSTGRES_PASSWORD: jlp, POSTGRES_DB: jlp }
    ports: ["5432:5432"]
    volumes: [ "pgdata:/var/lib/postgresql/data" ]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jlp"]
      interval: 2s
      timeout: 3s
      retries: 15

  ollama:
    # Local-model server for the "ollama" AI provider (Task 11, PRD
    # §23/§24) — in-network only, no published host port: the app
    # container reaches it at http://ollama:11434 (APP_AI_OLLAMA_URL's
    # default), nothing outside the compose network needs to. Not
    # started by a plain `make up`; join it explicitly with `--profile
    # ollama` (see `make ollama-pull` below, which does this for you).
    image: ollama/ollama
    profiles: ["ollama"]
    volumes: [ "ollamadata:/root/.ollama" ]

  tools:
    build: { context: ., target: dev }
    profiles: ["tools"]
    volumes:
      - .:/src
      - gomod:/go/pkg/mod
      - gocache:/root/.cache/go-build
    environment:
      GOFLAGS: -buildvcs=false # see app service note
      APP_DATABASE_URL: postgres://jlp:jlp@postgres:5432/jlp?sslmode=disable
      # `make send-summary` runs `jlp send-summary` in THIS container
      # (see the Makefile), so it needs the same weekly-summary env
      # passthrough the app service gets above — APP_SUMMARY_TO in
      # particular, since runSendSummary fails fast without a recipient.
      APP_SUMMARY_TO: ${APP_SUMMARY_TO:-}
      APP_SUMMARY_FROM: ${APP_SUMMARY_FROM:-}
      APP_SMTP_ADDR: ${APP_SMTP_ADDR:-}
      # `make test-integration` (and `make mqtt-tap`/`make mqtt-demo`,
      # which exec into the mosquitto service directly rather than
      # this one) run in THIS container too; the MQTT integration test
      # (internal/adapters/mqtt/mqtt_test.go) skips itself unless this
      # is set — see that file's testBrokerURL doc comment.
      APP_MQTT_URL: ${APP_MQTT_URL:-}
      # `make slack-smoke` runs `jlp slack-smoke` in THIS container (see
      # the Makefile) — same passthrough need as APP_SUMMARY_TO above.
      APP_SLACK_APPTOKEN: ${APP_SLACK_APPTOKEN:-}
      APP_SLACK_BOTTOKEN: ${APP_SLACK_BOTTOKEN:-}
      APP_SLACK_SMOKECHANNEL: ${APP_SLACK_SMOKECHANNEL:-}

  caddy:
    image: caddy:2
    profiles: ["auth"]
    ports: ["8443:8443"]
    volumes:
      - ./deploy/caddy/Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on: [app, authelia]
    networks:
      default:
        # Fixed address so the app's trusted-proxy CIDR (above) can name
        # Caddy specifically, distinct from the bridge gateway.
        ipv4_address: 172.28.5.9

  mailpit:
    # SMTP capture inbox for local dev (Phase 3 Task 5, PRD §21/§65):
    # the weekly summary's actual delivery target when APP_SMTP_ADDR is
    # left at its default (mailpit:1025, in-network only — no host port
    # for SMTP). The UI (8025) IS published so a browser can inspect
    # what got sent. Not started by a plain `make up`; join it
    # explicitly with `make up-mail` (mirrors `make ollama-pull`'s own
    # "--profile ollama" join for the ollama service above).
    image: axllent/mailpit
    profiles: ["mail"]
    ports: ["8025:8025"]

  mosquitto:
    # MQTT broker for the event bridge (Phase 3 Task 6, PRD
    # §31-33/§12/§59): internal/adapters/mqtt.Bridge dials this at
    # tcp://mosquitto:1883 (APP_MQTT_URL, set by `make up-mqtt` below).
    # No host port published — in-network only, same "join it
    # explicitly" posture as ollama/mailpit above (`--profile mqtt`).
    # See deploy/mosquitto/mosquitto.conf for the (LAN-dev-only,
    # allow_anonymous) broker config.
    image: eclipse-mosquitto:2
    profiles: ["mqtt"]
    volumes:
      - ./deploy/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  signal-cli:
    # signal-cli JSON-RPC daemon for the Signal channel adapter (Phase 4
    # Task 5, PRD §20/§20.1): internal/adapters/signal dials this at
    # tcp://signal-cli:6006 (APP_SIGNAL_RPCURL, set by `make up-signal`
    # below) over a plain newline-delimited JSON-RPC 2.0 connection —
    # see that package's own doc comment for the wire protocol. No
    # host port published — in-network only, same "join it explicitly"
    # posture as ollama/mailpit/mosquitto above (`--profile signal`).
    #
    # Deliberately started WITHOUT a `-a <number>` account of its own:
    # internal/config.Signal.Number is instead sent as the JSON-RPC
    # "account" param on every call this adapter makes, so the daemon
    # itself never needs restarting just to point it at a different
    # linked number. Until an account is actually linked (`make
    # signal-register` — see deploy/signal/README.md, the phone-in-hand
    # one-time step this repo cannot itself complete), every call the
    # adapter makes gets back a "not registered" JSON-RPC error — logged,
    # never fatal (see internal/adapters/signal's own doc comment) —
    # which is the documented, expected state of a freshly started
    # sidecar with no linked device yet.
    # No official signal-cli Docker image exists on any registry (see
    # deploy/signal/README.md) — deploy/signal/Dockerfile builds one
    # from the pinned, checksummed upstream release tarball instead of
    # trusting an arbitrary third-party image.
    build: { context: deploy/signal }
    profiles: ["signal"]
    # --config pins the data directory explicitly (rather than relying
    # on the image's own default) so the volume mount below is
    # unambiguous: this is the ONLY place the linked device's keys
    # live — losing it means re-linking from the phone again.
    command: ["--config", "/var/lib/signal-cli", "daemon", "--tcp", "0.0.0.0:6006"]
    volumes:
      - signaldata:/var/lib/signal-cli

  authelia:
    # Pinned to the same 4.39 minor as deploy/compose.prod.yml (parity
    # between dev and prod) rather than the floating :4 tag — see that
    # file's comment for why.
    image: authelia/authelia:4.39
    profiles: ["auth"]
    volumes:
      - ./deploy/authelia/configuration.dev.yml:/config/configuration.yml:ro
      - ./deploy/authelia/users.dev.yml:/config/users.yml:ro
      - autheliadata:/data

volumes: { pgdata: {}, gomod: {}, gocache: {}, caddydata: {}, autheliadata: {}, ollamadata: {}, signaldata: {} }

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.5.0/24
          # Reserve the lower half of the subnet from dynamic allocation so a
          # container started without a static address (postgres, app,
          # authelia, tools) can never race Caddy for its pinned 172.28.5.9
          # (used above in APP_AUTH_TRUSTEDPROXIES as the sole trusted peer).
          ip_range: 172.28.5.128/25
