version: "2"
linters:
  enable: [depguard]
  settings:
    depguard:
      rules:
        # domain-purity applies to every file, including tests: domain has
        # no ports to inject through, so a domain test importing an
        # adapter would be a genuine violation, not a legitimate test
        # double. No test files have ever been flagged by this rule.
        domain-purity:
          files: ["**/internal/domain/**"]
          deny:
            - pkg: github.com/mikeyaustin/jlp/internal/adapters
              desc: "Rule 1/2: domain imports no adapters"
            - pkg: github.com/mikeyaustin/jlp/internal/application
              desc: "dependencies point inward"
            - pkg: github.com/mikeyaustin/jlp/internal/ports
              desc: "domain defines no dependencies on ports"
            - { pkg: net/http, desc: "Rule 2" }
            - { pkg: github.com/jackc, desc: "Rule 2" }
            - { pkg: github.com/spf13/viper, desc: "Rule 2" }
        # agents-no-repos and application-no-adapters also apply to test
        # files by default. The exact three test files that construct
        # fakeai/inprocbus as port-shaped test doubles (injected through
        # the same constructors production wiring uses) carry an inline
        # //nolint:depguard on the specific import line rather than a
        # blanket file exemption — see
        # internal/agent/teacher/teacher_test.go,
        # internal/application/feedback/service_test.go,
        # internal/application/writing/service_test.go. Any other file
        # under internal/agent/** or internal/application/** that imports
        # a real adapter is still flagged.
        agents-no-repos:
          files: ["**/internal/agent/**"]
          deny:
            - pkg: github.com/mikeyaustin/jlp/internal/adapters
              desc: "Rule 3: agents reach state only through tools/services"
            - pkg: github.com/mikeyaustin/jlp/internal/ports/storage
              desc: "Rule 3: agents must not touch repositories"
        application-no-adapters:
          files: ["**/internal/application/**"]
          deny:
            - pkg: github.com/mikeyaustin/jlp/internal/adapters
              desc: "application depends on ports, not adapters"
