# Production stack: `make deploy-local` (locally, https://<JLP_DOMAIN>:8444 —
# see deploy/.env.prod.example) or `make deploy` (over
# DOCKER_HOST=ssh://$DEPLOY_HOST, identical compose path).
#
# A distinct project name (jlp-prod) and a distinct network subnet
# (172.31.5.0/24, vs. the dev stack's 172.28.5.0/24 in docker-compose.yml)
# keep this stack from colliding with the dev stack when both run on the
# same host — as they do during deploy-local verification.
name: jlp-prod

services:
  app:
    build: { context: .., target: prod }
    restart: unless-stopped
    # No source mounts (this is the distroless prod image, not `air`), and
    # no published port: the only way to reach the app is through Caddy,
    # which is the whole point of the trusted-proxy check below.
    environment:
      APP_DATABASE_URL: postgres://jlp:${POSTGRES_PASSWORD}@postgres:5432/jlp?sslmode=disable
      APP_AUTH_MODE: authelia
      # Caddy's fixed address on the pinned prod subnet below — the only
      # peer the app trusts to have already run forward_auth. Narrow CIDR
      # naming Caddy specifically, never the bridge gateway or a broad
      # /12: Docker hairpin-NATs host->published-port traffic through the
      # gateway, which would otherwise look indistinguishable from Caddy.
      # See docker-compose.yml / task-5-report.md for the dev-stack
      # writeup of this exact failure mode. 127.0.0.1/32 is carried over
      # for dev-stack parity (e.g. `docker compose ... run --rm app`
      # debugging from the host network namespace); it isn't load-bearing
      # for prod, where Caddy (172.31.5.9/32) is the only real caller.
      APP_AUTH_TRUSTEDPROXIES: 127.0.0.1/32,172.31.5.9/32
      # `app seed` target only — the authelia adapter authenticates
      # purely from Remote-User/Remote-Name headers set by Caddy, never
      # from these. Set to match whoever you actually log in as (see
      # AUTHELIA_PROD_USER/DISPLAYNAME in deploy/.env.prod.example) so
      # the seeded session belongs to that identity.
      APP_AUTH_STATIC_ID: ${APP_AUTH_STATIC_ID:-admin}
      APP_AUTH_STATIC_DISPLAYNAME: ${APP_AUTH_STATIC_DISPLAYNAME:-Admin}
      APP_AI_PROVIDER: ${APP_AI_PROVIDER:-fake}
      APP_AI_ANTHROPIC_APIKEY: ${ANTHROPIC_API_KEY:-}
      # Empty is safe: viper's getEnv only honors a bound env var when
      # it's non-empty, so an unset override here falls through to
      # config's own defaults rather than blanking them out.
      APP_AI_ANTHROPIC_MODEL: ${APP_AI_ANTHROPIC_MODEL:-}
      APP_AI_ANTHROPIC_BASEURL: ${APP_AI_ANTHROPIC_BASEURL:-}
      # Gemini (internal/adapters/gemini). Empty APIKEY is the dormant
      # contract: with no key the provider is never constructed, so a
      # deployment that doesn't use it boots exactly as before. MODEL and
      # BASEURL are safe to leave empty for the same viper reason as
      # Anthropic's above — they fall through to config's defaults
      # (gemini-3-flash-preview / https://generativelanguage.googleapis.com).
      APP_AI_GEMINI_APIKEY: ${GEMINI_API_KEY:-}
      APP_AI_GEMINI_MODEL: ${APP_AI_GEMINI_MODEL:-}
      APP_AI_GEMINI_BASEURL: ${APP_AI_GEMINI_BASEURL:-}
      APP_AI_GEMINI_TIMEOUT: ${APP_AI_GEMINI_TIMEOUT:-}
    depends_on:
      postgres: { condition: service_healthy }

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment: { POSTGRES_USER: jlp, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}", POSTGRES_DB: jlp }
    volumes: [ "pgdata_prod:/var/lib/postgresql/data" ]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jlp"]
      interval: 2s
      timeout: 3s
      retries: 15

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["8444:8444"]
    environment:
      JLP_DOMAIN: ${JLP_DOMAIN}
    volumes:
      - ./caddy/Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddydata_prod:/data
    depends_on: [app, authelia]
    networks:
      default:
        # Fixed address so the app's trusted-proxy CIDR (above) can name
        # Caddy specifically, distinct from the bridge gateway.
        ipv4_address: 172.31.5.9

  authelia:
    # Pinned to the 4.39 minor (not the floating :4 tag) so a new
    # major/minor release can't silently change behavior on redeploy —
    # e.g. v4.40 drops the `expand-env` config filter this stack's
    # configuration.prod.yml still relies on (see task-19-report.md).
    image: authelia/authelia:4.39
    restart: unless-stopped
    environment:
      JLP_DOMAIN: ${JLP_DOMAIN}
      # Enables Authelia's config-file preprocessing: `expand-env`
      # substitutes ${JLP_DOMAIN} (used for the cookie domain / portal
      # URLs in configuration.prod.yml) and `template` evaluates the
      # `{{ secret "/path" }}` function so the three Authelia secrets are
      # read from mounted files instead of living in the committed YAML.
      X_AUTHELIA_CONFIG_FILTERS: template,expand-env
    volumes:
      - ./authelia/configuration.prod.yml:/config/configuration.yml:ro
      - ./authelia/users.prod.yml:/config/users.yml:ro
      - ./authelia/secrets:/secrets:ro
      - autheliadata_prod:/data

volumes: { pgdata_prod: {}, caddydata_prod: {}, autheliadata_prod: {} }

networks:
  default:
    ipam:
      config:
        - subnet: 172.31.5.0/24
          # Reserve the lower half of the subnet from dynamic allocation so
          # a container started without a static address (postgres, app,
          # authelia) can never race Caddy for its pinned 172.31.5.9 (used
          # above in APP_AUTH_TRUSTEDPROXIES as the sole trusted peer).
          ip_range: 172.31.5.128/25
