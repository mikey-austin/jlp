# Dev-only mosquitto config for the docker-compose "mqtt" profile
# (Phase 3 Task 6, PRD §31-33/§12/§59). Mounted read-only into the
# eclipse-mosquitto:2 container by docker-compose.yml; there is no
# published host port — only the app/tools containers, on the compose
# network, ever reach this broker at mosquitto:1883.

listener 1883

# LAN dev only: no credentials, no ACLs. Anyone who can reach the
# broker (any container on the compose network, or — see
# docker-compose.yml's network section — anything else on the LAN if
# this port were ever published) can publish/subscribe any topic,
# including learner/{identity}/vocabulary/ingest as any identity
# string (see internal/adapters/mqtt's package doc comment for the
# exact trust model this implies for inbound ingestion). A production
# deployment that exposes MQTT beyond a trusted LAN MUST add
# authentication (password_file) and topic ACLs (acl_file) here
# instead of allow_anonymous.
allow_anonymous true

# No persistence: this is a live event-observation/ingestion bus, not
# a durable store — the durable copy of every learning event is
# already the learning_events table (see application/learning.Recorder,
# which appends there BEFORE this bridge ever publishes). Losing
# in-flight MQTT messages on a mosquitto restart loses nothing that
# doesn't already exist there.
persistence false

log_dest stdout
